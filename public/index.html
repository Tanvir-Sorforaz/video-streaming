<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Movie Sync</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="name-box" id="nameBox">
    <div class="name-card">
      <h2>Enter Your Name</h2>
      <input type="text" id="username" placeholder="Your name" />
      <button id="joinBtn">Join</button>
    </div>
  </div>

  <div class="app">
    <div class="player" id="player">
      <video id="video" class="fit-contain" controls autoplay playsinline webkit-playsinline preload="metadata">
        <source src="/video" type="video/mp4">
        <track kind="subtitles" src="/subtitle" srclang="en" label="English" default />
      </video>
      <div class="chat-overlay" id="chatOverlay" hidden>
        <button class="chat-head" id="chatHead" type="button" aria-label="Open watch-party chat" aria-expanded="false" aria-controls="chatPanel" title="Watch-party chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z" />
            <path d="M7 10h10M7 13h7" />
          </svg>
          <span class="unread-badge" id="chatBadge" hidden></span>
          <span class="voice-mic-badge" id="voiceMicBadge" hidden></span>
        </button>
        <div class="chat-previews" id="chatPreviews" aria-live="polite"></div>
        <span class="voice-speaker-pill" id="voiceSpeakerPill" hidden></span>
        <span class="visually-hidden" id="voiceSpeakingLive" aria-live="polite"></span>
        <span class="duck-label" id="duckLabel" hidden>Movie 30%</span>
        <section class="chat-panel" id="chatPanel" role="dialog" aria-label="Chat" aria-hidden="true" hidden inert>
          <header class="chat-header">
            <div class="chat-avatar" id="chatAvatar">WP</div>
            <div class="chat-heading">
              <h2>Watch party</h2>
              <p id="chatSubtitle"><span id="onlineCountValue">0</span> online</p>
            </div>
            <button class="voice-header-button" id="voiceHeaderButton" type="button" aria-label="Join voice" title="Join voice">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8" /></svg>
            </button>
            <button class="chat-close" id="chatClose" type="button" aria-label="Close chat" title="Close chat">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </header>
          <div class="voice-strip" id="voiceStrip">
            <button class="voice-settings-button" id="voiceSettingsButton" type="button" aria-label="Voice settings" title="Voice settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.3v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.3l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-1.3-3.1h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 1.3-3.1l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3.1-1.3v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3.1 1.3l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 1.3 3.1h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-1.3 3.1Z" /></svg>
            </button>
            <section class="voice-settings" id="voiceSettings" aria-label="Voice settings" hidden>
              <header class="voice-settings-header">
                <h3>Voice settings</h3>
                <button class="voice-settings-close" id="voiceSettingsClose" type="button" aria-label="Close voice settings" title="Close settings">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
                </button>
              </header>
              <p class="voice-device-permission" id="voiceDevicePermission" hidden>
                <span>Allow microphone access to see your devices</span>
                <button id="voiceAllowDevices" type="button">Allow</button>
              </p>
              <label class="voice-device-field" for="voiceMicrophone">Microphone
                <select id="voiceMicrophone"></select>
              </label>
              <p class="voice-device-hint" id="voiceBluetoothHint" hidden></p>
              <div class="voice-device-field" id="voiceSpeakerField">
                <label for="voiceSpeaker">Speaker / headphones</label>
                <select id="voiceSpeaker"></select>
              </div>
              <p class="voice-device-hint" id="voiceOutputHint" hidden></p>
              <label class="voice-movie-output" id="voiceMovieOutputLabel" for="voiceMovieOutput">
                <input id="voiceMovieOutput" type="checkbox" checked />
                <span>Also play the movie here</span>
              </label>
              <div class="voice-level-row">
                <label for="voiceLevelMeter">Microphone level</label>
                <meter id="voiceLevelMeter" min="0" max="1" value="0"></meter>
                <button id="voiceTestButton" type="button">Test</button>
              </div>
              <p class="voice-device-notice" id="voiceDeviceNotice" role="status" aria-live="polite" hidden></p>
            </section>
            <div class="voice-join-row" id="voiceJoinRow">
              <svg class="headphones-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3M3 14h4v7H5a2 2 0 0 1-2-2v-5ZM21 14h-4v7h2a2 2 0 0 0 2-2v-5Z" /></svg>
              <span class="headphones-copy">Headphones recommended</span>
              <span class="voice-count-label" id="voiceCountLabel" hidden></span>
              <button class="voice-join-button" id="voiceJoinButton" type="button" aria-label="Join voice">Join voice</button>
            </div>
            <div class="voice-error" id="voiceError" role="alert" hidden>
              <span id="voiceErrorText"></span>
              <button id="voiceTryAgain" type="button" hidden>Try again</button>
            </div>
            <div class="voice-call" id="voiceCall" hidden>
              <div class="voice-participants" id="voiceParticipants"></div>
              <div class="voice-controls" id="voiceControls">
                <button class="voice-mute-button" id="voiceMuteButton" type="button" aria-label="Mute microphone" aria-pressed="false"></button>
                <button class="voice-leave-button" id="voiceLeaveButton" type="button" aria-label="Leave voice">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6" /></svg>
                  <span>Leave</span>
                </button>
                <label class="duck-control" for="duckToggle">
                  <input id="duckToggle" type="checkbox" checked />
                  <span class="duck-switch" aria-hidden="true"></span>
                  <span>Reduce movie volume when talking</span>
                </label>
              </div>
            </div>
            <button class="audio-enable-button" id="voiceAudioEnable" type="button" hidden>Tap to enable audio</button>
            <p class="voice-status" id="voiceStatus" role="status" hidden></p>
            <div class="voice-popover" id="voicePopover" hidden></div>
          </div>
          <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
          <button class="new-messages" id="newMessages" type="button" hidden>New messages</button>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" type="text" placeholder="Aa" maxlength="300" autocomplete="off" aria-label="Message" />
            <button class="chat-send" type="submit" aria-label="Send message" title="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.2 18-3.9-7.9L2 9.2 21 3Z" /><path d="M10 13 21 3" /></svg>
            </button>
          </form>
        </section>
      </div>
    </div>

    <div class="controls">
      <button id="back">⏪ -10s</button>
      <button id="forward">⏩ +10s</button>
      <button id="fit">📱 Fit</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <script src="voice.js"></script>
</body>

</html>
